# Fly.io: one small always-on machine. `fly deploy -c hosting/fly.toml` from the repo root.
app = "research-desk-checker"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"   # relative to this file

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # a chat tool cannot wait for a cold start
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
